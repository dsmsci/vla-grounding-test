[project]
name = "groot-libero-mvp"
version = "0.2.0"
description = "Frozen GR00T N1.7 causal interventions in LIBERO"
requires-python = "==3.12.*"
dependencies = [
  "fire==0.7.1", "hydra-core==1.3.7", "mlflow==3.17.1",
  "torch==2.9.0", "torchvision==0.24.0", "transformers==4.57.3",
  "diffusers==0.35.1", "huggingface-hub==0.36.0", "numpy==1.26.4",
  "scipy==1.15.3", "pandas==2.2.3", "matplotlib==3.10.1", "pillow==11.3.0",
  "einops==0.8.1", "dm-tree==0.1.9", "albumentations==1.4.18",
  "opencv-python-headless==4.10.0.84",
  "omegaconf==2.3.0", "pydantic==2.12.3", "av==16.0.1",
  "robosuite==1.4.1", "robomimic==0.2.0", "mujoco==3.3.1", "bddl==1.0.1",
  "easydict==1.13", "gym==0.26.2", "gymnasium==1.2.2",
  "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "termcolor==3.2.0",
  "future==1.0.0", "tyro==0.9.17"
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# robosuite's GUI OpenCV overlaps with the headless distribution supplying cv2.
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake==3.31.6"]

[tool.ruff]
line-length = 110
